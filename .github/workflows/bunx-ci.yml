name: Bunx CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bunx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-types:
    name: Bun.SSH types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
          download-url: "https://github.com/oven-sh/bun/releases/download"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Bun.SSH declarations
        run: bun test test/integration/bun-types/bun-types.test.ts -t "Bun.SSH options"

  native-ssh-tests:
    name: Native SSH integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      # The same multi-arch Bun development image used by `bun run:linux`.
      image: ghcr.io/oven-sh/bun-development-docker-image@sha256:6349e267d2e27abd6b15f7fe76c4c3bbefcb4e9ff953666aae2539615d4bd431
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
          download-url: "https://github.com/oven-sh/bun/releases/download"

      - name: Install SSH test server
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and run SSH integration tests
        run: bun bd test test/js/ssh/ssh.test.ts

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
