name: Bunx release packages

on:
  push:
    tags: ["bunx-v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: bunx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 360
    container:
      # Pin the multi-arch image so package builds stay reproducible.
      image: ghcr.io/oven-sh/bun-development-docker-image@sha256:6349e267d2e27abd6b15f7fe76c4c3bbefcb4e9ff953666aae2539615d4bd431
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: linux-x64
            os: linux
            arch: x64
            abi: gnu
          - target: linux-aarch64
            os: linux
            arch: aarch64
            abi: gnu
            runner: ubuntu-24.04-arm
          - target: linux-x64-musl
            os: linux
            arch: x64
            abi: musl
          - target: linux-aarch64-musl
            os: linux
            arch: aarch64
            abi: musl
          - target: darwin-x64
            os: darwin
            arch: x64
            abi: ""
          - target: darwin-aarch64
            os: darwin
            arch: aarch64
            abi: ""
          - target: windows-x64
            os: windows
            arch: x64
            abi: ""
          - target: windows-aarch64
            os: windows
            arch: aarch64
            abi: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release
        env:
          TARGET: ${{ matrix.target }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          args=(
            "--profile=release"
            "--ci=on"
            "--build-dir=build/release-${TARGET}"
            "--os=${TARGET_OS}"
            "--arch=${TARGET_ARCH}"
          )
          if [[ -n "${TARGET_ABI}" ]]; then
            args+=("--abi=${TARGET_ABI}")
          fi
          bun scripts/build.ts "${args[@]}"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          TARGET_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail

          exe=bun
          if [[ "${TARGET_OS}" == "windows" ]]; then
            exe=bun.exe
          fi

          src="build/release-${TARGET}/${exe}"
          package="bun-${TARGET}"
          test -f "${src}"
          mkdir -p "dist/${package}"
          cp "${src}" "dist/${package}/${exe}"
          chmod +x "dist/${package}/${exe}" 2>/dev/null || true
          (
            cd dist
            cmake -E tar cfv "${package}.zip" --format=zip "${package}"
            sha256sum "${package}.zip" > "${package}.sha256"
          )

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bun-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/bunx-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bun-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: cat ./*.sha256 | sort > SHA256SUMS.txt

      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "${TAG}" >/dev/null 2>&1 ||
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          gh release upload "${TAG}" ./*.zip SHA256SUMS.txt --clobber
